spring.application.name=srm-credit-engine
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:srm_credit_engine}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:srm}
spring.datasource.password=${DB_PASSWORD:srm}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# devtools liga include-stacktrace=always por padrao; regra 1.8 proibe stacktrace na resposta
server.error.include-stacktrace=never
server.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

frankfurter.api.base-url=${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.liquidacao.queue=liquidacao.queue
app.rabbitmq.liquidacao.exchange=liquidacao.exchange
app.rabbitmq.liquidacao.routing-key=liquidacao.process

app.rabbitmq.liquidacao.dlx=liquidacao.dlx
app.rabbitmq.liquidacao.dlq=liquidacao.dlq
app.rabbitmq.liquidacao.dlq-routing-key=liquidacao.dlq

# Retry com backoff exponencial. max-retries conta RETENTATIVAS, nao entregas: 2 aqui significa
# 1 entrega inicial + 2 retentativas = 3 execucoes, com esperas de 1s e 2s.
# ATENCAO: a propriedade e max-retries, nao max-attempts. No Spring Boot 4 max-attempts esta
# deprecada em nivel 'error' e e ignorada em silencio — configurar por ela nao surte efeito algum.
# default-requeue-rejected=false e o que faz a mensagem rejeitada ir para a DLX em vez de
# voltar para a fila original — sem ele, falha permanente vira loop infinito de reprocessamento.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
