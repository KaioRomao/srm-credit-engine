spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:srm_credit_engine}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:srm}
spring.datasource.password=${DB_PASSWORD:srm}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.liquidacao.queue=liquidacao.queue
app.rabbitmq.liquidacao.exchange=liquidacao.exchange
app.rabbitmq.liquidacao.routing-key=liquidacao.process
app.rabbitmq.liquidacao.dlx=liquidacao.dlx
app.rabbitmq.liquidacao.dlq=liquidacao.dlq
app.rabbitmq.liquidacao.dlq-routing-key=liquidacao.dlq

frankfurter.api.base-url=${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
